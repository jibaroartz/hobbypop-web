name: Publicar sitio

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 5 * * *"   # 12:05 a. m. hora de Panama: publica la entrada del dia
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar el sitio
        run: python3 scripts/generar.py
      - name: Copiar solo lo publico
        run: |
          mkdir _site
          rsync -a ./ _site/ --exclude=.git --exclude=.github --exclude=_site --exclude=prototipo --exclude=scripts --exclude=src --exclude=contenido --exclude=data --exclude=CLAUDE.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
